# Publishes FreeMyTV.apk as a GitHub Release whenever a tag like v1.6 is pushed. The app updates itself from it.
# Needs two repository secrets: KEYSTORE_B64 (base64 of release.keystore) and KEYSTORE_PASS.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Build and sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          FREEMYTV_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export FREEMYTV_KEYSTORE="$RUNNER_TEMP/release.keystore"
          export FREEMYTV_VERSION="${GITHUB_REF_NAME#v}"
          # versionCode from the tag (v1.7 -> 1007, v2.10 -> 2010): always above the 7 and 8 of the first builds.
          V="$FREEMYTV_VERSION"; export FREEMYTV_VERSION_CODE=$(( ${V%%.*} * 1000 + ${V#*.} ))
          ./build.sh --generic
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" FreeMyTV.apk --title "$GITHUB_REF_NAME" --generate-notes
